name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        # If forms fail after deploy, add these under
        # Settings > Secrets and variables > Actions and uncomment:
        # env:
        #   VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        #   VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Find build output and add SPA fallback
        run: |
          OUT=""
          for d in dist dist/client build out .output/public; do
            if [ -f "$d/index.html" ]; then OUT="$d"; break; fi
          done

          if [ -z "$OUT" ]; then
            echo "::error::No index.html found in any known output folder."
            echo "--- Project root ---"; ls -la
            echo "--- dist (if it exists) ---"; ls -R dist 2>/dev/null | head -80 || true
            echo "--- package.json scripts ---"; grep -A12 '"scripts"' package.json || true
            exit 1
          fi

          echo "Using build output: $OUT"
          cp "$OUT/index.html" "$OUT/404.html"
          touch "$OUT/.nojekyll"
          echo "OUT_DIR=$OUT" >> "$GITHUB_ENV"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.OUT_DIR }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
